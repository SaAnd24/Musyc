name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto (si hay zip)
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -q -o "$z"
          done
          true

      - name: Localizar proyecto
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          [ -n "$f" ] || { echo "No se encontró settings.gradle.kts"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Proyecto en: $(dirname "$f")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JullMood-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
